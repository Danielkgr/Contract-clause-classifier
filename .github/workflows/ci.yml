name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the test dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest

  no-venv:
    name: no virtual environment committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # .gitignore only knows the usual names.  pyvenv.cfg marks any venv, virtualenv
      # or uv environment whatever it is called, and site-packages/ catches conda ones.
      - name: Fail if a virtual environment is tracked
        run: |
          if git ls-files | grep -E '(^|/)(pyvenv\.cfg$|site-packages/)'; then
            echo "::error::A Python virtual environment is committed.  Untrack it with 'git rm -r --cached <dir>' and add the directory to .gitignore."
            exit 1
          fi
